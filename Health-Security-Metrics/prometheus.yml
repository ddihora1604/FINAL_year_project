global:
  scrape_interval: 5s      # Scrape metrics every 5 seconds
  evaluation_interval: 5s   # Evaluate rules every 5 seconds

scrape_configs:
  - job_name: 'rag_pipeline'
    static_configs:
      - targets: ['host.docker.internal:8000']  # For Docker Desktop on Windows/Mac
        # For Linux, use: ['localhost:8000']
    
    # Optional: Add labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rag_pipeline'
    
    # Add timeout and interval explicitly
    scrape_interval: 5s
    scrape_timeout: 4s
