version: '3.8'

services:
  # Frontend - React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
      - REACT_APP_GRAFANA_URL=http://localhost:3002
    depends_on:
      - backend
    networks:
      - rag-network
    restart: unless-stopped

  # Backend - FastAPI Application
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - OLLAMA_URL=http://host.docker.internal:11434
      - METRICS_PORT=8001
      - PROMETHEUS_URL=http://prometheus:9090
      - MODEL_NAME=llama3.2
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - TEMPERATURE=0.7
      - MAX_TOKENS=1024
      - TOP_K_RESULTS=5
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/conversations:/app/conversations
      - ./RAG-Pipeline-Ollama:/app/RAG-Pipeline-Ollama
      - ./Health-Security-Metrics:/app/Health-Security-Metrics
    depends_on:
      - prometheus
    networks:
      - rag-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./Health-Security-Metrics/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - rag-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Health-Security-Metrics/grafana/provisioning:/etc/grafana/provisioning
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - rag-network
    restart: unless-stopped

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  rag-network:
    driver: bridge
